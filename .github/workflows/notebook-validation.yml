name: Notebook validation

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lending-notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install notebook validation dependency
        run: python -m pip install nbformat
      - name: Validate notebook
        run: python validate_notebook.py
      - name: Run structural tests
        run: python -m unittest discover -s tests -v
